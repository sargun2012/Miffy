name: Miffy New Member Welcome

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *

permissions:
  contents: write

jobs:
  welcome:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for new Miffy members
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e

          mkdir -p data

          curl -fsSL \
            -A "Miffy-Club-Website/1.0" \
            "https://api.chess.com/pub/club/miffy-1/members" \
            -o members.json

          jq '[.weekly[], .monthly[], .all_time[]] | map(.username) | unique' members.json > current-members.json

          if [ ! -f data/miffy-members.json ]; then
            cp current-members.json data/miffy-members.json
            echo "First run: member list saved."
            exit 0
          fi

          NEW_MEMBER=$(jq -r \
            --slurpfile old data/miffy-members.json \
            '.[]
             | select(. as $name | ($old[0] | index($name) | not))
             ' current-members.json | head -n 1)

          cp current-members.json data/miffy-members.json

          if [ -z "$NEW_MEMBER" ]; then
            echo "No new members found."
            exit 0
          fi

          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is missing."
            exit 1
          fi

          echo "New member found: $NEW_MEMBER"

          PROMPT="Write a short, friendly welcome message for a new member named $NEW_MEMBER joining the Miffy Chess.com club. Make it cozy, cheerful, Miffy-themed, and about chess. Do not use hashtags. Keep it under 40 words."

          RESPONSE=$(jq -n \
            --arg model "gpt-5.6-luna" \
            --arg input "$PROMPT" \
            '{model: $model, input: $input}' \
            | curl -fsSL \
                "https://api.openai.com/v1/responses" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $OPENAI_API_KEY" \
                --data-binary @-)

          MESSAGE=$(echo "$RESPONSE" | jq -r '.output_text // empty')

          if [ -z "$MESSAGE" ]; then
            echo "OpenAI did not return a message."
            echo "$RESPONSE"
            exit 1
          fi

          jq -n \
            --arg username "$NEW_MEMBER" \
            --arg message "$MESSAGE" \
            --arg created_at "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            '{
              username: $username,
              message: $message,
              created_at: $created_at
            }' > data/welcome.json

          echo "Welcome message created."

      - name: Save changes
        run: |
          git config user.name "miffy-welcome-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update Miffy welcome message"
            git push
          fi
