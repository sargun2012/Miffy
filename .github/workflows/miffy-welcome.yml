name: Miffy New Member Welcome

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  welcome:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Chess.com members
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          async function main() {
            const response = await fetch(
              "https://api.chess.com/pub/club/miffy-1/members",
              {
                headers: {
                  "User-Agent": "Miffy-Club-Website/1.0"
                }
              }
            );

            if (!response.ok) {
              throw new Error(
                `Chess.com API returned ${response.status}`
              );
            }

            const data = await response.json();

            const members = (data.all_time || [])
              .map(x => x.username)
              .filter(Boolean);

            fs.mkdirSync("data", { recursive: true });

            const stateFile = "data/miffy-members.json";

            if (!fs.existsSync(stateFile)) {
              fs.writeFileSync(
                stateFile,
                JSON.stringify(members, null, 2)
              );

              console.log(
                `First run complete. Saved ${members.length} members.`
              );

              return;
            }

            const oldMembers = JSON.parse(
              fs.readFileSync(stateFile, "utf8")
            );

            const newMembers = members.filter(
              username => !oldMembers.includes(username)
            );

            fs.writeFileSync(
              stateFile,
              JSON.stringify(members, null, 2)
            );

            if (newMembers.length === 0) {
              console.log("No new members.");
              return;
            }

            if (!process.env.OPENAI_API_KEY) {
              throw new Error("OPENAI_API_KEY secret is missing.");
            }

            const username = newMembers[0];

            const ai = await fetch(
              "https://api.openai.com/v1/responses",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization":
                    `Bearer ${process.env.OPENAI_API_KEY}`
                },
                body: JSON.stringify({
                  model: "gpt-5.6-luna",
                  input:
                    `Write a short, friendly Miffy-themed welcome ` +
                    `message for Chess.com club member ${username}. ` +
                    `Mention chess and keep it cozy.`
                })
              }
            );

            if (!ai.ok) {
              throw new Error(
                `OpenAI API returned ${ai.status}: ${await ai.text()}`
              );
            }

            const result = await ai.json();

            fs.writeFileSync(
              "data/welcome.json",
              JSON.stringify(
                {
                  username,
                  message: result.output_text || "",
                  created_at: new Date().toISOString()
                },
                null,
                2
              )
            );

            console.log(`Welcome created for ${username}.`);
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Save website data
        run: |
          git config user.name "miffy-welcome-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update Miffy welcome message"
            git push
          fi
